      <main>
        <!-- Page Hero -->
        <section id="page-hero">
          <h1>Enquiry</h1>

          <p>Send us your paint enquiries and requests today</p>
        </section>

        <!-- Enquiry Form -->
        <section>
          <div id="enquiry-form">
            <form action="https://formspree.io/f/xbdbqpbo" method="POST">
              <div class="form-group">
                <label for="full-name">Full Name</label>

                <input
                  type="text"
                  id="full-name"
                  name="full-name"
                  placeholder="Enter your full name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Enter your phone number"
                  required
                />
              </div>

              <div class="form-group">
                <label for="email">Email Address</label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email address"
                />
              </div>

              <div class="form-group">
                <label for="paint-type">Paint Type</label>

                <select id="paint-type" name="paint-type">
                  <option value="">Select Paint Type</option>

                  <option value="emulsion">Emulsion Paint</option>

                  <option value="satin">Satin Paint</option>

                  <option value="texcote">Texcote</option>

                  <option value="gloss">Gloss Paint</option>
                </select>
              </div>

              <div class="form-group">
                <label for="quantity">Quantity</label>

                <input
                  type="text"
                  id="quantity"
                  name="quantity"
                  placeholder="Example: 2 Drums"
                />
              </div>

              <div class="form-group">
                <label for="address">Delivery Address</label>

                <!-- CORRECT -->
                <textarea
                  id="address"
                  name="address"
                  rows="4"
                  placeholder="Enter delivery address"
                ></textarea>
              </div>

              <div class="form-group">
                <label for="message">Message</label>

                <!-- CORRECT -->
                <textarea
                  id="message"
                  name="message"
                  rows="5"
                  placeholder="Write your message here"
                ></textarea>
              </div>

              <button type="submit" class="btn">Send Enquiry</button>
            </form>
          </div>
        </section>
      </main>
